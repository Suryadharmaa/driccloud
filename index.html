<script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

/* ============================= Constants ============================= */
const STORAGE = {
  chats: "cerdas_chats", projects: "cerdas_projects", memory: "cerdas_memory",
  groq: "cerdas_groq_key", openrouter: "cerdas_openrouter_key", personality: "cerdas_personality",
  theme: "cerdas_theme", settings: "cerdas_settings"
};
const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
const OPENROUTER_URL = "https://openrouter.ai/api/v1/chat/completions";

/* KEY POOL MODULE
   Isi slot di bawah sebelum deploy ke GitHub Pages jika ingin semua pengunjung langsung bisa memakai AI.
   PERINGATAN: GitHub Pages adalah static hosting. Key yang ditaruh di sini bisa dilihat siapa pun lewat DevTools/source.
   Untuk produksi sungguhan, gunakan backend/proxy agar key tidak terekspos. */
const EMBEDDED_GROQ_KEYS = [
  "GROQ_KEY_1_HERE",
  "GROQ_KEY_2_HERE",
  "GROQ_KEY_3_HERE",
  "GROQ_KEY_4_HERE",
  "GROQ_KEY_5_HERE",
].filter(k => k && !k.includes("_HERE"));
const EMBEDDED_OR_KEYS = [
  "OR_KEY_1_HERE",
  "OR_KEY_2_HERE",
  "OR_KEY_3_HERE",
  "OR_KEY_4_HERE",
  "OR_KEY_5_HERE",
].filter(k => k && !k.includes("_HERE"));
class KeyPool {
  constructor(type) {
    this.type = type;
    this.pointer = 0;
    this.pool = [];
    this._init();
  }
  _storageKey() { return this.type === "groq" ? STORAGE.groq : STORAGE.openrouter; }
  _embeddedKeys() { return this.type === "groq" ? EMBEDDED_GROQ_KEYS : EMBEDDED_OR_KEYS; }
  _init() {
    const stored = (localStorage.getItem(this._storageKey()) || "").split(/[\n,]+/).map(k => k.trim()).filter(Boolean);
    const previous = new Map(this.pool.map(e => [e.key, e]));
    const keys = [...new Set([...this._embeddedKeys(), ...stored])];
    this.pool = keys.map(key => ({
      key,
      hits: previous.get(key)?.hits || 0,
      errors: previous.get(key)?.errors || 0,
      lastError: previous.get(key)?.lastError || null,
      cooldownUntil: previous.get(key)?.cooldownUntil || 0,
      status: previous.get(key)?.status || "active",
    }));
  }
  _refresh() {
    const keep = new Map(this.pool.map(e => [e.key, e]));
    this._init();
    this.pool = this.pool.map(e => ({...e, ...(keep.get(e.key) || {})}));
  }
  _persistUserKeys() {
    const embedded = new Set(this._embeddedKeys());
    const userKeys = this.pool.filter(e => !embedded.has(e.key)).map(e => e.key).join("\n");
    localStorage.setItem(this._storageKey(), userKeys);
  }
  next() {
    this._refresh();
    const now = Date.now();
    this.pool.forEach(e => {
      if (e.status === "cooling" && now > e.cooldownUntil) e.status = "active";
    });
    const active = this.pool.filter(e => e.status === "active");
    if (!active.length) return null;
    const entry = active[this.pointer % active.length];
    this.pointer = (this.pointer + 1) % Math.max(active.length, 1);
    return entry;
  }
  markSuccess(key) { const e = this.pool.find(x => x.key === key); if (e) { e.hits++; e.status = "active"; e.lastError = null; } }
  markRateLimit(key) { const e = this.pool.find(x => x.key === key); if (e) { e.status = "cooling"; e.cooldownUntil = Date.now() + 60000; e.errors++; e.lastError = "rate_limit"; } }
  markDead(key) { const e = this.pool.find(x => x.key === key); if (e) { e.status = "dead"; e.errors++; e.lastError = "invalid_key"; } }
  addKey(key) {
    key = String(key || "").trim();
    if (!key || this.pool.some(e => e.key === key)) return false;
    this.pool.push({key, hits:0, errors:0, lastError:null, cooldownUntil:0, status:"active"});
    this._persistUserKeys();
    return true;
  }
  removeKey(key) {
    this.pool = this.pool.filter(e => e.key !== key);
    this._persistUserKeys();
  }
  get count() { this._refresh(); return this.pool.length; }
  get summary() {
    this._refresh();

const sanitize = str => String(str || "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ============================= Markdown + Math ============================= */
function renderMarkdown(md) {
  if (!window.marked) return sanitize(md);
  let src = String(md || "");
  const blocks = [];
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, (_, math) => {
    const token = `@@MATH_BLOCK_${blocks.length}@@`;
    blocks.push(() => katex.renderToString(math.trim(), {displayMode:true, throwOnError:false}));
    return token;
  }).replace(/\$([^$\n]+?)\$/g, (_, math) => {
    const token = `@@MATH_BLOCK_${blocks.length}@@`;
    blocks.push(() => katex.renderToString(math.trim(), {displayMode:false, throwOnError:false}));
    return token;
  });
  marked.setOptions({
    gfm: true,
    breaks: true,
    highlight: (code, lang) => {
      try { return lang && hljs.getLanguage(lang) ? hljs.highlight(code, {language: lang}).value : hljs.highlightAuto(code).value; }
      catch { return sanitize(code); }
    }
  });
  let html = marked.parse(src);
  blocks.forEach((fn, i) => { html = html.replace(`@@MATH_BLOCK_${i}@@`, fn()); });
  return html;
}
function splitThinking(text) {
  const match = String(text || "").match(/<think>([\s\S]*?)<\/think>/i);
  if (!match) return {thinking:"", answer:text || ""};
  return {thinking:match[1].trim(), answer:String(text).replace(match[0],"").trim()};
}

/* ============================= File Processing ============================= */
async function readFileAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
async function readFileAsText(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); }); }
async function readFileAsArrayBuffer(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsArrayBuffer(file); }); }
async function processFile(file) {
  if (file.size > 10 * 1024 * 1024) throw new Error(`${file.name} melebihi 10MB`);
  const ext = file.name.split(".").pop().toLowerCase();
  if (["png","jpg","jpeg"].includes(ext)) return {name:file.name, type:"image", mime:file.type, content:await readFileAsDataURL(file)};
  if (ext === "pdf") {
    const buf = await readFileAsArrayBuffer(file);
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    let text = "";
    for (let p=1; p<=pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      text += `\n\n--- Halaman ${p} ---\n` + content.items.map(i => i.str).join(" ");
    }
    return {name:file.name, type:"text", content:text.slice(0,60000)};
  }
  if (ext === "docx") {
    const result = await mammoth.extractRawText({arrayBuffer:await readFileAsArrayBuffer(file)});
    return {name:file.name, type:"text", content:result.value.slice(0,60000)};
  }
  if (["xlsx","xlsm"].includes(ext)) {
    const wb = XLSX.read(await readFileAsArrayBuffer(file), {type:"array"});
    const data = wb.SheetNames.map(n => ({sheet:n, rows:XLSX.utils.sheet_to_json(wb.Sheets[n], {defval:""})}));
    return {name:file.name, type:"text", content:JSON.stringify(data, null, 2).slice(0,60000)};
  }
  if (ext === "zip") {
    const zip = await JSZip.loadAsync(await readFileAsArrayBuffer(file));
    let out = "Isi ZIP:\n" + Object.keys(zip.files).join("\n");
    const readable = /\.(txt|md|csv|json|py|js|ts|html|css|cpp|c|h|java|php)$/i;
    for (const [name, entry] of Object.entries(zip.files).slice(0,40)) {
      if (!entry.dir && readable.test(name)) out += `\n\n[FILE: ${name}]\n` + (await entry.async("string")).slice(0,12000);
    }
    return {name:file.name, type:"text", content:out.slice(0,70000)};
  }
  return {name:file.name, type:"text", content:(await readFileAsText(file)).slice(0,60000)};
}
function filesToPrompt(files) {
  return (Array.isArray(files) ? files : []).filter(f => f && f.type !== "image").map(f => `\n\n[FILE: ${f.name}]\n\`\`\`\n${f.content}\n\`\`\`\n`).join("");
}

/* MODULE 2: TOKEN EFFICIENCY */
const estimateTokens = (text) => Math.ceil(String(text || "").length / 4);
const MODEL_CONTEXT = {
  "llama-3.3-70b-versatile": 32768,
  "llama-3.1-8b-instant": 8192,
  "meta-llama/llama-4-scout-17b-16e-instruct": 8192,
  "openrouter/free": 8192,
  "deepseek/deepseek-v4-flash:free": 65536,
  "arcee-ai/trinity-large-thinking:free": 32768,
  "nousresearch/hermes-3-llama-3.1-405b:free": 32768,
  "google/gemma-4-26b-a4b-it:free": 32768,
};
const SYSTEM_RESERVE = 3200;
const RESPONSE_RESERVE = 2048;
function smartSliceMessages(messages, modelId) {
  const budget = Math.max(1200, (MODEL_CONTEXT[modelId] || 8192) - SYSTEM_RESERVE - RESPONSE_RESERVE);
  let used = 0;
  const result = [];
  const clean = (Array.isArray(messages) ? messages : []).filter(m => m && !(m.role === "assistant" && !String(m.content || "").trim()));
  const first = clean[0];
  const reversed = [...clean].reverse();
  for (const msg of reversed) {
    if (first && msg.id === first.id && result.some(m => m.id === first.id)) continue;
    const fileText = (msg.files || []).map(f => f.type === "text" ? f.content : "").join("");
    const cost = estimateTokens(msg.content) + estimateTokens(fileText) + 8;
    if (used + cost > budget && result.length > 0) break;
    used += cost;
    result.unshift(msg);
  }
  if (first && !result.some(m => m.id === first.id) && result.length > 0) {
    const firstCost = estimateTokens(first.content) + 8;
    if (used + firstCost <= budget) result.unshift(first);
  }
  return { messages: result, estimatedTokens: used };
}

function buildSystemPrompt({personality, memory, subject, project, compress=false}) {
  const notes = (memory.importantNotes || []).map(n => n.note || n).slice(-3).join("; ");
  const memCtx = memory.studentName
    ? `[SISWA] ${memory.studentName}, Kelas ${memory.grade||"?"}, Kuat: ${(memory.strongSubjects||[]).slice(0,3).join(",") || "-"}, Perlu: ${(memory.weakSubjects||[]).slice(0,3).join(",") || "-"}, Catatan: ${notes || "-"}, Sesi: ${memory.sessionCount||1}.`
    : `[SESI] Ke-${memory.sessionCount||1}.`;
  const subjectCtx = `[MAPEL: ${subject}] Jawab langsung, padat, hemat token. Tabel/bullet hanya jika esensial.`;
  const projCtx = project?.customInstructions ? `[PROJECT]\n${project.customInstructions.slice(0,400)}` : "";
  const persCtx = personality === "friendly" ? FRIENDLY : PRO;
  if (compress) {
    return [
      `Kamu VT AI, guru SMA Indonesia master-level. Kurikulum Merdeka/K13. AKURASI MUTLAK: Matematika tampilkan SEMUA langkah, kode harus runnable 100%.`,
      persCtx.slice(0, 180),
      memCtx, subjectCtx, projCtx
    ].filter(Boolean).join("\n\n");
  }
  return [BASE_PROMPT, persCtx, memCtx, subjectCtx, projCtx].filter(Boolean).join("\n\n");
}
function compactContent(content, limit=4200) {
  const text = String(content || "").replace(/\n{3,}/g, "\n\n").trim();
  if (text.length <= limit) return text;
  return text.slice(0, limit) + `\n\n[Konten dipotong otomatis oleh VT AI untuk efisiensi token: ${text.length - limit} karakter tidak dikirim.]`;
}
function toApiMessages(chat, memory, subject, project, personality, settings) {
  const modelId = currentModelId(settings);
  const msgCount = (chat.messages || []).filter(m => m.role === "user").length;
  const useCompressed = msgCount >= 3 && chat.subject === subject;
  const systemPrompt = buildSystemPrompt({personality, memory, subject, project, compress: useCompressed});
  const { messages: slicedMsgs } = smartSliceMessages((chat.messages || []), modelId);
  const apiMessages = [{role:"system", content:systemPrompt}];
  slicedMsgs.forEach(m => {
    if (m.role === "assistant") {
      apiMessages.push({role:"assistant", content:compactContent(m.content, 1800)});
    } else {
      const text = compactContent((m.content || "") + filesToPrompt(m.files || []), 7000);
      const images = (m.files || []).filter(f => f.type === "image");
      if (images.length && isVisionModel(modelId)) {
        apiMessages.push({role:"user", content:[{type:"text", text}, ...images.map(f => ({type:"image_url", image_url:{url:f.content}}))]});
      } else apiMessages.push({role:"user", content:text});
    }
  });
  return apiMessages;
}
/* KEY POOL MODULE */
async function streamCompletion({settings, messages, onDelta, signal}) {
  const type = settings.modelType;
  const pool = type === "fast" ? groqPool : orPool;
  const url = type === "fast" ? GROQ_URL : OPENROUTER_URL;
  const maxAttempts = Math.max(pool.count, 1);
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    const entry = pool.next();
    if (!entry) throw new Error("NO_KEYS");
    try {
      const res = await fetch(url, {
        method:"POST",
        headers:apiHeaders(type, entry.key),
        signal,
        body:JSON.stringify({model:currentModelId(settings), messages, stream:true, temperature:.4})
      });
      if (res.status === 429) { pool.markRateLimit(entry.key); continue; }
      if (res.status === 401 || res.status === 403) { pool.markDead(entry.key); continue; }
      if (!res.ok || !res.body) { pool.markRateLimit(entry.key); continue; }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let usage = null, buffer = "";
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream:true});
        const lines = buffer.split("\n");
        buffer = lines.pop() || "";
        for (const raw of lines) {
          const line = raw.trim();
          if (!line.startsWith("data: ")) continue;
          const data = line.slice(6);
          if (data === "[DONE]") { pool.markSuccess(entry.key); return usage; }
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content || "";
            if (delta) onDelta(delta);
            if (json.usage) usage = {prompt:json.usage.prompt_tokens, completion:json.usage.completion_tokens, total:json.usage.total_tokens};
          } catch {}
        }
      }
      pool.markSuccess(entry.key);
      return usage;
    } catch (err) {
      if (err.name === "AbortError") throw err;
      pool.markRateLimit(entry.key);
      if (attempt === maxAttempts - 1) throw err;
    }
  }
  throw new Error("ALL_KEYS_EXHAUSTED");
}
async function extractMemory({chat, setMemory}) {
  const entry = groqPool.next();
  if (!entry) return;
  const groqKey = entry.key;
  const model = "llama-3.1-8b-instant";
  const headers = {"Authorization":`Bearer ${groqKey}`, "Content-Type":"application/json"};
  const lastMsgs = (chat.messages || []).slice(-4)
    .map(m => `${m.role[0].toUpperCase()}: ${String(m.content || "").slice(0,300)}`)
    .join("\n");
  const prompt = `Extract student info JSON from this conversation.
Return ONLY valid JSON, no markdown:
{"studentName":null,"detectedGrade":null,"strongHint":null,"weakHint":null,"importantNote":null}
Replace null with found values only.
Conversation:
${lastMsgs}`;
  try {
    const res = await fetch(GROQ_URL, {method:"POST", headers, body:JSON.stringify({model, messages:[{role:"user", content:prompt}], temperature:0, max_tokens:100})});
    if (res.status === 429) { groqPool.markRateLimit(groqKey); return; }
    if (res.status === 401 || res.status === 403) { groqPool.markDead(groqKey); return; }
    if (!res.ok) return;
    groqPool.markSuccess(groqKey);
    const txt = (await res.json()).choices?.[0]?.message?.content || "null";
    const data = JSON.parse(txt.replace(/```[a-z]*|```/g,"").trim());
    if (!data) return;
    setMemory(prev => {
      const next = {...prev};
      if (data.studentName && !next.studentName) next.studentName = data.studentName;
      if (data.detectedGrade && !next.grade) next.grade = String(data.detectedGrade);
      if (data.strongHint && !next.strongSubjects?.includes(data.strongHint)) next.strongSubjects = [...(next.strongSubjects||[]), data.strongHint];
      if (data.weakHint && !next.weakSubjects?.includes(data.weakHint)) next.weakSubjects = [...(next.weakSubjects||[]), data.weakHint];
      if (data.importantNote) next.importantNotes = [...(next.importantNotes||[]), {note:data.importantNote, date:new Date().toISOString()}].slice(-20);
      next.lastSeen = new Date().toISOString();
      return next;
    });
  } catch { groqPool.markRateLimit(groqKey); }
}

/* MODULE 3: INTERACTIVE POLISH */
function ShortcutsOverlay({open, onClose}) {
  if (!open) return null;
  const shortcuts = [
    ["Ctrl+N", "New Chat"],
    ["Ctrl+K", "Search"],
    ["Ctrl+,", "Settings"],
    ["Enter", "Kirim pesan"],
    ["Shift+Enter", "Baris baru"],
    ["Esc", "Tutup modal"],
  ];
  return <div className="fixed inset-0 z-[70] bg-black/60 grid place-items-center p-4" onMouseDown={onClose}>
    <div className="modal-enter surface border rounded-2xl w-[380px] max-w-full p-5" onMouseDown={e => e.stopPropagation()}>
      <div className="flex justify-between mb-4"><h2 className="font-bold">⌨️ Keyboard Shortcuts</h2><button onClick={onClose}>×</button></div>
      <div className="space-y-2">
        {shortcuts.map(([key, desc]) => <div key={key} className="flex justify-between">
          <span className="text-secondary">{desc}</span>
          <kbd className="elevated border rounded-lg px-2 py-0.5 text-xs mono">{key}</kbd>
        </div>)}
      </div>
    </div>
  </div>;
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = {error:null};
  }
  static getDerivedStateFromError(error) {
    return {error};
  }
  componentDidCatch(error, info) {
    console.error("VT AI render error:", error, info);
  }
  render() {
    if (!this.state.error) return this.props.children;
    return <div className="h-full grid place-items-center p-6">
      <div className="surface border rounded-2xl p-6 max-w-lg text-center">
        <div className="mx-auto w-14 h-14 rounded-2xl btn-primary grid place-items-center font-black mb-4">VT</div>
        <h1 className="text-xl font-bold mb-2">VT AI gagal memuat data lokal</h1>
        <p className="text-secondary text-sm mb-4">Kemungkinan ada data chat/settings lama yang rusak di localStorage. Coba bersihkan data lokal aplikasi.</p>
        <pre className="text-left text-xs elevated border rounded-xl p-3 overflow-auto mb-4">{String(this.state.error?.message || this.state.error)}</pre>
        <button className="btn-primary rounded-xl px-4 py-2 font-semibold" onClick={() => {
          [STORAGE.chats, STORAGE.projects, STORAGE.memory, STORAGE.settings].forEach(k => localStorage.removeItem(k));
          location.reload();
        }}>Reset Data Lokal VT AI</button>
      </div>
    </div>;
  }
}

/* ============================= App ============================= */
function App() {
  const [theme,setTheme] = useState(localStorage.getItem(STORAGE.theme) || "dark");
  const [chats,setChats] = useState(normalizeChats(load(STORAGE.chats, [])));
  const [projects,setProjects] = useState(normalizeProjects(load(STORAGE.projects, [])));
  const [memory,setMemory] = useState(normalizeMemory(load(STORAGE.memory, DEFAULT_MEMORY)));
  const [settings,setSettings] = useState(normalizeSettings(load(STORAGE.settings, DEFAULT_SETTINGS)));
  const [personality,setPersonality] = useState(localStorage.getItem(STORAGE.personality) || "friendly");
  const [activeId,setActiveId] = useState(chats[0]?.id || null);
  const [input,setInput] = useState("");
  const [files,setFiles] = useState([]);
  const [subject,setSubject] = useState(settings.defaultSubject || "Matematika");
  const [loading,setLoading] = useState(false);
  const [settingsOpen,setSettingsOpen] = useState(false);
  const [projectOpen,setProjectOpen] = useState(false);
  const [sideOpen,setSideOpen] = useState(false);
  const [search,setSearchRaw] = useState("");
  const [debouncedSearch,setDebouncedSearch] = useState("");
  const [toasts,setToasts] = useState([]);
  const [newMsgButton,setNewMsgButton] = useState(false);
  const [isDragging,setIsDragging] = useState(false);
  const [shortcutsOpen,setShortcutsOpen] = useState(false);
  const [keyPoolTick,setKeyPoolTick] = useState(0);
  const messagesRef = useRef(null);
  const abortRef = useRef(null);
  const activeChat = chats.find(c => c.id === activeId) || null;
  const activeMessages = Array.isArray(activeChat?.messages) ? activeChat.messages : [];
  const hasKey = (groqPool.count + orPool.count) > 0;
  const toast = (kind, message, action) => {
    const id = uid(); setToasts(t => [...t, {id, kind, message, action}]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 5000);
  };
  const setSearch = useMemo(() => debounce(v => setDebouncedSearch(v), 300), []);
  useEffect(() => { setSearch(debouncedSearch); }, []);
  const onSearchChange = v => { setSearchRaw(v); setSearch(v); };
  useEffect(() => { document.documentElement.classList.toggle("light", theme === "light"); localStorage.setItem(STORAGE.theme, theme); }, [theme]);
  useEffect(() => save(STORAGE.chats, chats), [chats]);
  useEffect(() => save(STORAGE.projects, projects), [projects]);
  useEffect(() => save(STORAGE.memory, memory), [memory]);
  useEffect(() => save(STORAGE.settings, settings), [settings]);
  useEffect(() => localStorage.setItem(STORAGE.personality, personality), [personality]);
  useEffect(() => { setMemory(m => ({...m, sessionCount:(m.sessionCount || 0) + 1, lastSeen:new Date().toISOString()})); }, []);
  useEffect(() => {
    const el = messagesRef.current; if (!el) return;
    const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 180;
    if (nearBottom) { el.scrollTop = el.scrollHeight; setNewMsgButton(false); } else setNewMsgButton(true);
  }, [activeMessages.length, activeMessages[activeMessages.length - 1]?.content]);
  useEffect(() => {
    const onKey = e => {
      if (e.ctrlKey && e.key.toLowerCase() === "k") { e.preventDefault(); document.getElementById("sidebar-search")?.focus(); }
      if (e.ctrlKey && e.key.toLowerCase() === "n") { e.preventDefault(); newChat(); }
      if (e.ctrlKey && e.key === ",") { e.preventDefault(); setSettingsOpen(true); }
      if (e.shiftKey && e.key === "?") { e.preventDefault(); setShortcutsOpen(true); }
      if (e.key === "Escape") { setSettingsOpen(false); setProjectOpen(false); setShortcutsOpen(false); }
    };
    window.addEventListener("keydown", onKey); return () => window.removeEventListener("keydown", onKey);
  }, [activeId, chats, subject]);
  const searchResults = useMemo(() => {
    const q = debouncedSearch.trim(); if(!q) return [];
    const out = [];
    chats.forEach(chat => {
      if (chat.title.toLowerCase().includes(q.toLowerCase())) out.push({chat, messageId:null, context:chat.title});
      (chat.messages || []).forEach(m => {
        const text = `${m.content} ${(m.files||[]).map(f=>f.name+" "+(f.type==="text"?f.content:"")).join(" ")}`;
        if (text.toLowerCase().includes(q.toLowerCase())) out.push({chat, messageId:m.id, context:excerpt(text,q)});
      });
    });
    return out.slice(0,40);
  }, [debouncedSearch, chats]);
  function newChat(startSubject = subject) {
    const now = new Date().toISOString();
    const chat = {id:uid(), title:"Chat baru", createdAt:now, updatedAt:now, projectId:null, subject:startSubject, personality, model:currentModelId(settings), modelType:settings.modelType, messages:[]};
    setChats(c => [chat, ...c]); setActiveId(chat.id); setSubject(startSubject);
  }
  function deleteChat(id) {
    if (!confirm("Hapus chat ini?")) return;
    const el = document.getElementById(`chat-row-${id}`);
    const remove = () => {
      setChats(c => c.filter(x => x.id !== id));
      if (activeId === id) setActiveId(chats.find(c => c.id !== id)?.id || null);
    };
    if (el) {
      el.classList.add("chat-row-exit");
      setTimeout(remove, 280);
    } else remove();
  }
  async function onFiles(fileList) {
    if (!fileList.length) return;
    const picked = fileList.slice(0, 5 - files.length);
    try {
      const processed = [];
      for (const f of picked) processed.push(await processFile(f));
      const next = [...files, ...processed].slice(0,5);
      setFiles(next);
      if (next.some(f => f.type === "image") && !isVisionModel(currentModelId(settings))) {
        toast("warn","Gambar terdeteksi. Gunakan VT.Vision untuk melihat gambar.", {label:"Switch to Vision Model", onClick:() => setSettings(s => ({...s, modelType:"fast", fastModel:"meta-llama/llama-4-scout-17b-16e-instruct"}))});
      }
    } catch(e) { toast("error", e.message || "Gagal membaca file."); }
  }
  async function send(regenerateFromId = null) {
    if (loading) return;
    let chat = activeChat;
    let text = input.trim();
    let sendingFiles = files;
    if (!regenerateFromId && !text && !sendingFiles.length) return;
    const activePool = settings.modelType === "fast" ? groqPool : orPool;
    if (activePool.count === 0) { toast("warn","Tidak ada API key tersedia. Isi embedded key pool di source atau tambahkan key di Settings."); setSettingsOpen(true); return; }
    if (!chat) {
      const now = new Date().toISOString();
      chat = {id:uid(), title:trimTitle(text || "Analisis file"), createdAt:now, updatedAt:now, projectId:null, subject, personality, model:currentModelId(settings), modelType:settings.modelType, messages:[]};
      setChats(c => [chat, ...c]); setActiveId(chat.id);
    }
    const now = new Date().toISOString();
    let baseMessages = chat.messages || [];
    if (regenerateFromId) {
      const idx = baseMessages.findIndex(m => m.id === regenerateFromId);
      baseMessages = baseMessages.slice(0, idx);
    } else {
      const userMsg = {id:uid(), role:"user", content:text, timestamp:now, files:sendingFiles, thinkingContent:null, tokenUsage:null};
      baseMessages = [...baseMessages, userMsg];
    }
    const assistantId = uid();
    const assistantMsg = {id:assistantId, role:"assistant", content:"", timestamp:new Date().toISOString(), files:[], thinkingContent:null, tokenUsage:null};
    const updatedChat = {...chat, title:chat.title === "Chat baru" ? trimTitle(text || sendingFiles[0]?.name) : chat.title, updatedAt:now, subject, personality, model:currentModelId(settings), modelType:settings.modelType, messages:[...baseMessages, assistantMsg]};
    setChats(cs => [updatedChat, ...cs.filter(c => c.id !== updatedChat.id)]);
    if (!regenerateFromId && baseMessages.filter(m => m.role === "user").length === 20) {
      toast("warn", "💡 Chat sudah panjang. Mulai chat baru agar AI lebih fokus dan hemat token.", {label:"New Chat", onClick:() => newChat(subject)});
    }
    setInput(""); setFiles([]); setLoading(true);
    let full = "";
    try {
      const project = projects.find(p => p.id === updatedChat.projectId);
      const messages = toApiMessages(updatedChat, memory, subject, project, personality, settings);
      const controller = new AbortController();
      abortRef.current = controller;
      const usage = await streamCompletion({settings, messages, signal:controller.signal, onDelta:(delta) => {
        full += delta;
        setChats(cs => cs.map(c => c.id === updatedChat.id ? {...c, messages:c.messages.map(m => m.id === assistantId ? {...m, content:full} : m), updatedAt:new Date().toISOString()} : c));
      }});
      setChats(cs => cs.map(c => c.id === updatedChat.id ? {...c, messages:c.messages.map(m => m.id === assistantId ? {...m, content:full || "Maaf, respons kosong.", tokenUsage:usage} : m)} : c));
      const finalChat = {...updatedChat, messages:[...baseMessages, {...assistantMsg, content:full || "Maaf, respons kosong.", tokenUsage:usage}]};
      extractMemory({chat:finalChat, setMemory});
    } catch(e) {
      if (e.name === "AbortError") {
        setChats(cs => cs.map(c => c.id === updatedChat.id ? {...c, messages:c.messages.map(m => m.id === assistantId ? {...m, content: full ? full + "\n\n*[Respons dihentikan]*" : "*[Respons dihentikan]*"} : m)} : c));
        setLoading(false);
        abortRef.current = null;
        return;
      }
      const ERR_MAP = {
        "NO_KEYS": "Tidak ada API key tersedia. Isi embedded key pool di source atau tambahkan key di Settings.",
        "ALL_KEYS_EXHAUSTED": "Semua key gagal atau sedang cooldown. Cek status key di Settings.",
        "RATE_LIMIT": "Semua key sedang rate-limited. Tunggu sekitar 60 detik.",
      };
      const detail = e.message && !["API_ERROR","Failed to fetch"].includes(e.message) ? ` Detail: ${e.message}` : "";
      const msg = ERR_MAP[e.message] || `Gagal menghubungi AI. Cek API key, model, atau koneksi internet.${detail}`;
      toast(e.message === "NO_KEYS" ? "warn" : "error", msg);
      setChats(cs => cs.map(c => c.id === updatedChat.id ? {...c, messages:c.messages.map(m => m.id === assistantId ? {...m, content:`**Error:** ${msg}`} : m)} : c));
    } finally { setLoading(false); abortRef.current = null; }
  }
  function copyMsg(msg) { navigator.clipboard.writeText(splitThinking(msg.content).answer || msg.content); toast("success","Disalin ke clipboard."); }
  function addProject(p) {
    setProjects(ps => [...ps, {id:uid(), ...p, createdAt:new Date().toISOString(), chats:[]}]);
    setProjectOpen(false);
  }
  function deleteProject(id) {
    const n = chats.filter(c => c.projectId === id).length;
    if (!confirm(`Hapus project beserta ${n} chat di dalamnya?`)) return;
    setProjects(ps => ps.filter(p => p.id !== id));
    setChats(cs => cs.filter(c => c.projectId !== id));
  }
  return <div className="mobile-shell h-full flex overflow-hidden">
    <Sidebar open={sideOpen} setOpen={setSideOpen} chats={chats} projects={projects} activeId={activeId} onNew={newChat} onOpen={id=>{setActiveId(id); setSideOpen(false);}} onDeleteChat={deleteChat} onSettings={()=>setSettingsOpen(true)} onNewProject={()=>setProjectOpen(true)} onDeleteProject={deleteProject} theme={theme} toggleTheme={()=>setTheme(theme==="light"?"dark":"light")} search={search} setSearch={onSearchChange} results={searchResults} onResult={r => {setActiveId(r.chat.id); setTimeout(()=>r.messageId && document.getElementById(`msg-${r.messageId}`)?.scrollIntoView({behavior:"smooth", block:"center"}),50);}} />
    {sideOpen && <div className="fixed inset-0 bg-black/50 z-30 md:hidden" onClick={()=>setSideOpen(false)} />}
    <main className="main flex-1 flex flex-col min-w-0 overflow-hidden">
      <div className="mobile-topbar">
        <button className="mobile-round-btn" onClick={()=>setSideOpen(true)} aria-label="Buka menu"><Icon name="menu" /></button>
        <button className="mobile-round-btn logo-btn" onClick={()=>setSettingsOpen(true)} aria-label="Buka settings"><span className="brand-logo w-full h-full rounded-full"><img src="vt-ai-logo.png" alt="VT AI" /></span></button>
      </div>
      <div className="mobile-promo">
        <span>Virtual Teacher.AI</span>
        <button onClick={()=>setSettingsOpen(true)}>Settings</button>
      </div>
      <header className="app-header h-14 surface border-b flex items-center justify-between px-4" style={{borderColor:"var(--border)"}}>
        <div className="flex items-center gap-3 min-w-0 flex-1">
          <button className="w-9 h-9 rounded-lg hoverable md:hidden" onClick={()=>setSideOpen(true)}><Icon name="menu" /></button>
          <button className="w-9 h-9 rounded-lg hoverable hidden md:block" onClick={()=>setSideOpen(true)}><Icon name="menu" /></button>
          <div className="brand-logo sidebar-brand-logo w-8 h-8 rounded-lg hidden sm:inline-grid"><img src="vt-ai-logo.png" alt="VT AI" /></div>
          <div className="font-semibold truncate">{activeChat?.title || "VT AI"}</div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          <button onClick={()=>setShortcutsOpen(true)} className="elevated border rounded-full px-3 py-1.5 text-sm hoverable" title="Keyboard shortcuts">?</button>
          <button onClick={()=>setPersonality(personality==="friendly"?"pro":"friendly")} className="elevated border rounded-full px-3 py-1.5 text-sm hoverable"><span className="md:hidden">{personality==="friendly"?"🌟":"⚡"}</span><span className="hidden md:inline">{personality==="friendly"?"🌟 Friendly":"⚡ Pro"}</span></button>
          <KeyStatusPill />
          <ModelDropdown settings={settings} setSettings={setSettings} direction="down" className="hidden md:block w-[260px] lg:w-[330px]" />
        </div>
      </header>
      <div ref={messagesRef} onScroll={e => setNewMsgButton(e.currentTarget.scrollHeight - e.currentTarget.scrollTop - e.currentTarget.clientHeight > 260)} onDragEnter={() => setIsDragging(true)} onDragLeave={e => { if(!e.currentTarget.contains(e.relatedTarget)) setIsDragging(false); }} onDrop={e => {e.preventDefault(); setIsDragging(false); onFiles([...e.dataTransfer.files]);}} onDragOver={e => e.preventDefault()} className="messages-pane flex-1 overflow-y-auto scrollbar relative">
        <div className={`drag-overlay ${isDragging ? "active" : ""}`} onDrop={e => { e.preventDefault(); setIsDragging(false); onFiles([...e.dataTransfer.files]); }} onDragOver={e => e.preventDefault()}>📎 Lepaskan file di sini</div>
        {!activeChat || activeChat.messages.length === 0 ? <Welcome hasKey={hasKey} onSubject={(s)=>{setSubject(s); newChat(s);}} /> :
          <div className="messages-list max-w-4xl mx-auto p-4 md:p-8 space-y-6 pb-16">
            {activeChat.messages.map(m => <Message key={m.id} msg={m} onCopy={copyMsg} onRegenerate={(msg)=>send(msg.id)} searchTerm={debouncedSearch} />)}
            {loading && <Typing thinking={settings.modelType === "thinking"} />}
          </div>}
        {newMsgButton && <button onClick={()=>{messagesRef.current.scrollTop=messagesRef.current.scrollHeight; setNewMsgButton(false);}} className="absolute bottom-4 left-1/2 btn-primary rounded-full px-4 py-2 text-sm shadow-xl scroll-bounce">↓ Pesan baru</button>}
      </div>
      <div className="disclaimer px-4 pb-1 text-center text-[11px] text-muted">⚠️ VT AI menggunakan data training AI. Verifikasi materi penting dengan buku paket resmi (BSE Kemdikbud). Untuk Matematika, selalu cek kembali perhitungan.</div>
      <InputBar value={input} setValue={setInput} onSend={()=>send()} loading={loading} files={files} setFiles={setFiles} onFiles={onFiles} subject={subject} setSubject={setSubject} settings={settings} setSettings={setSettings} activeChat={activeChat} abortRef={abortRef} />
    </main>
    <SettingsModal open={settingsOpen} onClose={()=>setSettingsOpen(false)} settings={settings} setSettings={setSettings} memory={memory} setMemory={setMemory} toast={toast} onPoolChange={()=>setKeyPoolTick(x => x + 1)} />
    <ProjectModal open={projectOpen} onClose={()=>setProjectOpen(false)} onSave={addProject} />
    <ShortcutsOverlay open={shortcutsOpen} onClose={()=>setShortcutsOpen(false)} />
    <Toasts toasts={toasts} onClose={id => setToasts(t => t.filter(x => x.id !== id))} />
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
